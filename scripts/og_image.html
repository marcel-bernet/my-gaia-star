<!doctype html>
<!--
  The share cards, drawn from the real naked-eye Gaia stars around Orion and
  set on the site's own sheet: ink text, the sky as a dark plate framed in ink,
  orange only for "your star". Regenerate them all with scripts/share_cards.sh. The layouts:

    link preview  public/og-image.png        1200×630   og_image.html
    story         public/story-{lang}.png    1080×1920  og_image.html?story&lang={en,es,ca}
    home icon     public/apple-touch-icon.png 180×180   og_image.html?icon
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: MonoHead;
        src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2);
      }
      @font-face {
        font-family: Mono;
        src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2);
      }
      @font-face {
        font-family: Sans;
        src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2);
      }
      :root {
        --bg: #f3f4f1;
        --text: #111316;
        --text-2: #42464c;
        --text-3: #5f646b;
        --star: #c23b00;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }
      canvas {
        position: absolute;
        display: block;
        outline: 1px solid var(--text);
      }
      .sheet {
        position: absolute;
        display: flex;
        flex-direction: column;
        border-top: 4px solid var(--text);
        border-bottom: 4px solid var(--text);
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 0.7em;
        font-family: MonoHead;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .wordmark svg {
        color: var(--star);
        width: 1.25em;
        height: 1.25em;
      }
      .kicker {
        font-family: Mono;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      h1 {
        margin: 0;
        font-family: MonoHead;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.12;
      }
      h1 em {
        font-style: normal;
        white-space: nowrap;
        color: var(--star);
      }
      p {
        margin: 0;
        font-family: Sans;
        line-height: 1.45;
        color: var(--text-2);
      }
      .caption {
        font-family: Mono;
        color: var(--text-3);
        letter-spacing: 0.02em;
      }
      .url {
        margin-top: auto;
        padding-top: 0.8em;
        border-top: 1px solid rgba(17, 19, 22, 0.3);
        font-family: Mono;
        color: var(--text);
        display: flex;
        justify-content: space-between;
      }
      .url b {
        font-weight: normal;
        color: var(--star);
      }

      /* Link preview, 1200×630: words left, plate right. */
      body.og {
        width: 1200px;
        height: 630px;
      }
      .og .sheet {
        left: 64px;
        top: 40px;
        width: 1072px;
        height: 550px;
        padding: 30px 0 22px;
        box-sizing: border-box;
      }
      .og .words {
        width: 540px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .og .wordmark {
        font-size: 17px;
      }
      .og .kicker {
        margin: 44px 0 14px;
        font-size: 14px;
      }
      .og h1 {
        font-size: 46px;
      }
      .og p {
        margin-top: 22px;
        font-size: 20px;
        max-width: 500px;
      }
      .og .url {
        font-size: 15px;
      }
      .og .caption {
        position: absolute;
        left: 612px;
        bottom: 22px;
        font-size: 12px;
      }

      /* Instagram story, 1080×1920. Instagram covers the top ~250px and bottom ~280px. */
      body.story {
        width: 1080px;
        height: 1920px;
      }
      .story .sheet {
        left: 80px;
        top: 230px;
        width: 920px;
        height: 1400px;
        padding: 40px 0 34px;
        box-sizing: border-box;
      }
      .story .wordmark {
        font-size: 30px;
      }
      .story .kicker {
        margin: 56px 0 20px;
        font-size: 24px;
      }
      .story h1 {
        font-size: 72px;
      }
      .story canvas {
        position: static;
        margin-top: 56px;
      }
      .story .caption {
        margin-top: 14px;
        font-size: 20px;
      }
      .story p {
        margin: 44px 0 40px;
        font-size: 34px;
      }
      .story .url {
        font-size: 28px;
      }

      /* Home-screen icon, 180×180. */
      body.icon {
        width: 180px;
        height: 180px;
      }
      .icon svg {
        position: absolute;
        inset: 30px;
        width: 120px;
        height: 120px;
        color: var(--star);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="sheet">
      <div class="words">
        <div class="wordmark">
          <svg viewBox="0 0 24 24" aria-hidden>
            <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="currentColor" stroke-width="1.5" />
            <circle cx="12" cy="12" r="1.75" fill="currentColor" />
          </svg>
          My Gaia Star
        </div>
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <p id="lede"></p>
        <div class="url"><span>marcel-bernet.github.io/my-gaia-star</span><b id="cta"></b></div>
      </div>
      <div class="caption" id="caption"></div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const layout = q.has('story') ? 'story' : q.has('icon') ? 'icon' : 'og';
      const lang = q.get('lang') || 'en';
      document.body.className = layout;

      const WORDS = {
        en: {
          kicker: 'ESA Gaia · 1.8 billion stars',
          title: 'Above you is a star <em>no one</em> has ever looked at.',
          lede: 'Find the star straight overhead in ESA’s Gaia catalogue, and check whether any paper has singled it out.',
          caption: 'FIG. 1 — Naked-eye Gaia DR3 stars around Orion',
          cta: 'Find yours →',
          mine: 'YOUR STAR',
        },
        es: {
          kicker: 'ESA Gaia · 1800 millones de estrellas',
          title: 'Sobre ti hay una estrella que <em>nadie</em> ha mirado nunca.',
          lede: 'Encuentra la estrella que tienes justo encima en el catálogo Gaia de la ESA, y comprueba si algún artículo se ha fijado en ella.',
          caption: 'FIG. 1 — Estrellas de Gaia DR3 visibles a simple vista, en Orión',
          cta: 'Encuentra la tuya →',
          mine: 'TU ESTRELLA',
        },
        ca: {
          kicker: 'ESA Gaia · 1.800 milions d’estrelles',
          title: 'Sobre teu hi ha una estrella que <em>ningú</em> no ha mirat mai.',
          lede: 'Troba l’estrella que tens just a sobre al catàleg Gaia de l’ESA, i comprova si algun article s’hi ha fixat.',
          caption: 'FIG. 1 — Estrelles de Gaia DR3 visibles a ull nu, a Orió',
          cta: 'Troba la teva →',
          mine: 'LA TEVA ESTRELLA',
        },
      }[lang];
      document.documentElement.lang = lang;
      for (const id of ['kicker', 'lede', 'caption', 'cta']) document.getElementById(id).textContent = WORDS[id];
      document.getElementById('title').innerHTML = WORDS.title;

      // The plate, in page pixels.
      const PLATE = { og: [660, 92, 476, 448], story: [0, 0, 920, 600], icon: null }[layout];
      // The story stacks everything in one column: words, plate, caption, lede.
      if (layout === 'story') {
        const title = document.getElementById('title');
        title.after(document.getElementById('c'), document.getElementById('caption'));
      }

      const D = Math.PI / 180;
      function projector(cx, cy, r, field) {
        const RA0 = 84 * D,
          DEC0 = 2 * D;
        const K = r / (2 * Math.tan(field / 2));
        return (ra, dec) => {
          ra *= D;
          dec *= D;
          const cosc = Math.sin(DEC0) * Math.sin(dec) + Math.cos(DEC0) * Math.cos(dec) * Math.cos(ra - RA0);
          if (cosc < Math.cos(field * 1.4)) return null;
          const k = (2 * K) / (1 + cosc);
          // East to the left, as the sky looks from below.
          const x = -k * Math.cos(dec) * Math.sin(ra - RA0);
          const y = -k * (Math.cos(DEC0) * Math.sin(dec) - Math.sin(DEC0) * Math.cos(dec) * Math.cos(ra - RA0));
          return [cx + x, cy + y];
        };
      }
      // Gaia BP−RP to a star's tint, blue-white through gold to orange-red.
      function tint(c) {
        const stops = [
          [-0.2, [170, 195, 255]],
          [0.4, [225, 232, 255]],
          [0.8, [255, 244, 225]],
          [1.3, [255, 214, 160]],
          [2.2, [255, 170, 110]],
        ];
        c = Math.max(-0.2, Math.min(2.2, c ?? 0.8));
        let i = 0;
        while (i < stops.length - 2 && c > stops[i + 1][0]) i++;
        const [a, ca] = stops[i],
          [b, cb] = stops[i + 1],
          f = (c - a) / (b - a);
        return ca.map((v, j) => Math.round(v + (cb[j] - v) * f));
      }
      let seed = 7;
      const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

      (async () => {
        await document.fonts.ready;
        if (!PLATE) {
          document.body.innerHTML +=
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/></svg>';
          document.querySelector('canvas').remove();
          document.querySelector('.sheet').remove();
          document.title = 'ready';
          return;
        }
        const [px, py, pw, ph] = PLATE;
        const canvas = document.getElementById('c');
        Object.assign(canvas.style, { left: px + 'px', top: py + 'px', width: pw + 'px', height: ph + 'px' });
        canvas.width = pw * 2;
        canvas.height = ph * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        const scale = pw / 476;
        const project = projector(pw / 2, ph / 2, Math.max(pw, ph) * 0.6, 40 * D);

        const data = await (await fetch('../public/naked-eye.json')).json();
        const ix = Object.fromEntries(data.columns.map((c, i) => [c, i]));

        ctx.fillStyle = '#0b0c0e';
        ctx.fillRect(0, 0, pw, ph);
        // Milky Way dust: countless faint points, denser along a band.
        for (let n = 0; n < 5200 * scale; n++) {
          const t = rand() * 2 - 1,
            s = (rand() + rand() + rand() - 1.5) * 150 * scale;
          const x = pw / 2 - 40 * scale + t * 420 * scale + s * 0.45,
            y = ph / 2 + t * 260 * scale - s;
          ctx.fillStyle = `rgba(233,231,226,${0.08 + rand() * 0.22})`;
          ctx.fillRect(x, y, 0.8, 0.8);
        }
        for (let n = 0; n < 900 * scale; n++) {
          ctx.fillStyle = `rgba(233,231,226,${0.06 + rand() * 0.25})`;
          ctx.fillRect(rand() * pw, rand() * ph, 0.9, 0.9);
        }
        // The real stars, sized by brightness.
        const stars = data.rows
          .map(r => ({ id: r[ix.id], g: r[ix.g], c: r[ix.bpRp], p: project(r[ix.ra], r[ix.dec]) }))
          .filter(s => s.p);
        stars.sort((a, b) => b.g - a.g);
        const k = Math.sqrt(scale);
        for (const s of stars) {
          const [x, y] = s.p;
          const r = Math.max(0.7, (6 - s.g * 0.95) * k);
          const [cr, cg, cb] = tint(s.c);
          const alpha = Math.min(1, Math.max(0.25, (6.6 - s.g) / 3.5));
          if (s.g < 2.5) {
            const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
            glow.addColorStop(0, `rgba(${cr},${cg},${cb},0.35)`);
            glow.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, r * 5, 0, 2 * Math.PI);
            ctx.fill();
          }
          ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, 2 * Math.PI);
          ctx.fill();
        }

        // "Your star": a faint one, alone, under the orange reticle, with room for its label.
        const u = k;
        const inside = s => s.p[0] > 60 * u && s.p[0] < pw - 230 * u && s.p[1] > 60 * u && s.p[1] < ph - 60 * u;
        const alone = (s, d) => !stars.some(o => o !== s && o.g < 5 && Math.hypot(o.p[0] - s.p[0], o.p[1] - s.p[1]) < d * u);
        const pool = stars.filter(s => s.g > 5.3 && inside(s));
        const mine = (pool.some(s => alone(s, 34)) ? pool.filter(s => alone(s, 34)) : pool)
          .map(s => ({ s, d: Math.hypot(s.p[0] - pw * 0.42, s.p[1] - ph * 0.55) }))
          .sort((a, b) => a.d - b.d)[0].s;
        const [mx, my] = mine.p;
        ctx.strokeStyle = '#ff7a3d';
        ctx.lineWidth = 1.4 * u;
        ctx.beginPath();
        ctx.arc(mx, my, 15 * u, 0, 2 * Math.PI);
        ctx.stroke();
        for (const [dx, dy] of [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ]) {
          ctx.beginPath();
          ctx.moveTo(mx + dx * 21 * u, my + dy * 21 * u);
          ctx.lineTo(mx + dx * 30 * u, my + dy * 30 * u);
          ctx.stroke();
        }
        ctx.fillStyle = '#ff7a3d';
        ctx.beginPath();
        ctx.arc(mx, my, 2.4 * u, 0, 2 * Math.PI);
        ctx.fill();
        // A patch of plate behind the label, so it reads over the stars.
        ctx.font = `${11 * u}px Mono`;
        ctx.fillStyle = 'rgba(11,12,14,0.85)';
        ctx.fillRect(mx + 34 * u, my - 18 * u, ctx.measureText(`Gaia DR3 ${mine.id}`).width + 8 * u, 36 * u);
        ctx.fillStyle = '#ff7a3d';
        ctx.font = `${12 * u}px Mono`;
        ctx.fillText(WORDS.mine, mx + 38 * u, my - 4 * u);
        ctx.fillStyle = 'rgba(233,231,226,0.6)';
        ctx.font = `${11 * u}px Mono`;
        ctx.fillText(`Gaia DR3 ${mine.id}`, mx + 38 * u, my + 12 * u);
        document.title = 'ready';
      })();
    </script>
  </body>
</html>
